<div class="app-shell">
  @if (auth.isAuthenticated()) {
    <div class="topbar">
      <a class="brand" routerLink="/">
        <img src="dialex-logo.svg" alt="" class="brand-logo" />
        <span class="brand-name">Dialex</span>
      </a>
      <div class="topbar-nav">
        <a routerLink="/debates">My debates</a>
        <a routerLink="/consultation">New case</a>
        <select
          class="theme-brand-select"
          [value]="theme.brand()"
          (change)="onBrandChange($any($event.target).value)"
          aria-label="Color theme"
        >
          <option value="citrus">Citrus</option>
          <option value="electric">Electric</option>
        </select>
        <button
          type="button"
          class="theme-mode-toggle"
          (click)="toggleMode()"
          [attr.aria-label]="theme.effectiveMode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          {{ theme.effectiveMode() === 'dark' ? '☾' : '☀' }}
        </button>
        <button type="button" (click)="logout()">Log out</button>
      </div>
    </div>
  }
  <div class="content">
    <router-outlet />
  </div>
</div>
