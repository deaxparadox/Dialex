name: dialex

networks:
  dialex-net:
    name: dialex-net

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Mapped to 5433 on the host, not 5432 — avoids clashing with any
      # pre-existing local Postgres already using the default port.
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dialex-net

  temporal-postgresql:
    image: postgres:${POSTGRESQL_VERSION}
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD}
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dialex-net

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: temporal-postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    networks:
      - dialex-net

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      # Host 8080 was already taken (same story as the Postgres/Redis ports
      # above) — mapped to 8088 instead.
      - "8088:8080"
    depends_on:
      - temporal
    networks:
      - dialex-net

  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - dialex-net

volumes:
  db_data:
  temporal_db_data:
